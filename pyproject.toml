[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commandertui"
dynamic = ["version"]
description = "Dual-pane retro terminal file manager: compare, sync, copy and move folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Humberto Barchini" }]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "send2trash>=1.8",
    "textual-image>=0.14.4",
    "pillow>=10.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
images = ["textual-image>=0.14.4", "pillow>=10.3"]
documents = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]
pdf-render = ["pypdf>=5.0", "pypdfium2>=4.30", "textual-image>=0.14.4", "pillow>=10.3"]
all = [
    "textual-image>=0.14.4",
    "pillow>=10.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/juniorbarchini-oss/commandertui"

[project.scripts]
commandertui = "commandertui.cli:main"

[tool.setuptools]
packages = ["commandertui"]

[tool.setuptools.dynamic]
version = { attr = "commandertui.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 110
target-version = ["py311"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commandertui"
dynamic = ["version"]
description = "Dual-pane retro terminal file manager: compare, sync, copy and move folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Humberto Barchini" }]
requires-python = ">=3.11"
dependencies = ["textual>=8.0", "send2trash>=1.8"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/juniorbarchini-oss/commandertui"

[project.scripts]
commandertui = "commandertui.cli:main"

[tool.setuptools]
packages = ["commandertui"]

[tool.setuptools.dynamic]
version = { attr = "commandertui.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 110
target-version = ["py311"]

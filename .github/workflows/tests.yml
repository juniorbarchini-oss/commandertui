name: Tests

# Runs the suite on every pull request and on pushes to the long-lived branches, so a
# failing test is seen before a release is tagged (publish.yml only runs at release time).
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rclone (the turbo-copy tests run the real binary)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Test
        run: |
          python -m pip install -e . -r requirements-dev.txt
          python -m pytest -q tests
      - name: Version is the same in every file
        run: python packaging/bump_version.py --check
